<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add me on iPerspective</title>

  <!-- Open Graph — this is what renders the picture card in iMessage,
       WhatsApp, etc. -->
  <meta property="og:title" content="Add me on iPerspective">
  <meta property="og:description" content="Join me on iPerspective — see the world differently.">
  <meta property="og:image" content="https://iperspective.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #89CFF0, #1565C0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      margin: 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .card img { width: 240px; max-width: 100%; }
    h1 { font-size: 22px; color: #1a1a1a; margin: 24px 0 8px; }
    p { color: #777; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    .btn {
      display: block;
      background: #1565C0;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .btn.alt { background: #eee; color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/og.png" alt="iPerspective">
    <h1>You've been invited!</h1>
    <p>Open this link on your phone with iPerspective installed, and
       you'll be connected automatically.</p>
    <a class="btn" id="open-app" href="#">Open in the app</a>
    <a class="btn alt" id="get-app"
       href="https://apps.apple.com/us/app/iperspective/id6745724034">Get the app</a>
  </div>

  <script>
    // Forward /i/<uid> (or /invite?...) into the app via the custom scheme.
    // If the app is installed, iOS/Android will have already intercepted the
    // https link as a universal link and this page is never seen.
    (function () {
      var path = location.pathname + location.search;
      var target = 'iperspective://app' + path;
      document.getElementById('open-app').href = target;
      // Android users get the Play Store link instead.
      if (/android/i.test(navigator.userAgent)) {
        document.getElementById('get-app').href =
          'https://play.google.com/store/apps/details?id=com.wynne.iperspective';
      }
      // Gentle auto-attempt after a moment.
      setTimeout(function () { location.href = target; }, 600);
    })();
  </script>
</body>
</html>
